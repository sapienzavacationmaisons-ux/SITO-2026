  <div class="header">
    <div class="logo"><i class="fas fa-bolt"></i><h1>Catalogo Elettrico</h1></div>
    <div style="display:flex;gap:1rem;align-items:center">
      <div class="search-wrapper"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Cerca..."></div>
      <div class="cart-icon" onclick="toggleCart()"><i class="fas fa-shopping-cart"></i><span class="cart-count" id="cartCount">0</span></div>
    </div>
  </div>
  
  <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:0.5rem;margin-bottom:0.8rem">
    <div class="admin-bar" id="adminBar" style="display:none">
      <span class="admin-badge"><i class="fas fa-lock-open"></i> ADMIN</span>
      <button class="admin-btn" onclick="exportData()"><i class="fas fa-download"></i> Backup</button>
      <button class="admin-btn import-csv" onclick="importCSV()"><i class="fas fa-file-csv"></i> Importa CSV</button>
      <button class="admin-btn update-prices" onclick="updatePricesOnly()"><i class="fas fa-chart-line"></i> Agg. Prezzi</button>
      <button class="admin-btn import-xml" onclick="importXML()"><i class="fas fa-file-code"></i> Importa XML</button>
      <button class="admin-btn photo-folder" onclick="caricaImmaginiDaCartella()"><i class="fas fa-folder-open"></i> Foto Cartella</button>
      <button class="admin-btn export-photos" onclick="exportPhotos()"><i class="fas fa-images"></i> Esporta Foto</button>
      <button class="admin-btn report" onclick="showReport()"><i class="fas fa-chart-line"></i> Report</button>
      <button class="admin-btn" onclick="showImportHistory()"><i class="fas fa-history"></i> Storico</button>
      <button class="admin-btn reset" onclick="resetAllData()"><i class="fas fa-trash-alt"></i> Reset</button>
      <button class="admin-btn danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Esci</button>
    </div>
    <button class="login-btn" id="loginBtn" onclick="toggleLogin()"><i class="fas fa-lock"></i> Accedi</button>
  </div>
  
  <input type="file" id="csvFullImportFile" style="display:none" accept=".csv" onchange="handleFullCSVFile(this)">
  <input type="file" id="csvImportFile" style="display:none" accept=".csv" onchange="handleCSVFile(this)">
  <input type="file" id="xmlImportFile" style="display:none" accept=".xml" onchange="handleXMLFile(this)">
  
  <div class="stats"><span id="productCount">0 prodotti</span><span>Prezzi IVA esclusa</span></div>
  <div id="productGrid" class="grid"></div>
  <div id="pagination" class="pagination"></div>
  <div class="footer" style="text-align:center;margin-top:1.5rem;padding-top:0.8rem;border-top:1px solid #e9eef2;font-size:0.65rem;color:#94a3b8">© Spinotteria ECOVA</div>
</div>

<div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
<div class="cart-panel" id="cartPanel">
  <div class="cart-header"><h3>Carrello</h3><button onclick="toggleCart()" style="border:none;background:none;font-size:1.5rem">&times;</button></div>
  <div class="cart-items" id="cartItems"><div style="text-align:center;padding:2rem;color:#94a3b8">Carrello vuoto</div></div>
  <div class="cart-footer" id="cartFooter" style="display:none">
    <div class="cart-total">Totale: € <span id="cartTotal">0,00</span> +IVA</div>
    <button class="cart-btn send-wa" onclick="sendWhatsApp()"><i class="fab fa-whatsapp"></i> Invia ordine</button>
    <button class="cart-btn clear" onclick="clearCart()">Svuota</button>
  </div>
</div>

  function getAllProductsList(){
    var merged = products.map(function(p){
      if(deletedProducts.includes(p.code)) return null;
      var custom = customProducts.find(function(c){ return c.code === p.code; });
      if(custom) return custom;
      return p;
    }).filter(function(p){ return p !== null; });
    var newProducts = customProducts.filter(function(c){
      return !products.some(function(b){ return b.code === c.code; }) && !deletedProducts.includes(c.code);
    });
    var all = merged.concat(newProducts);
    if(productOrder.length > 0){
      var ordered = [];
      for(var i=0; i<productOrder.length; i++){
        var found = all.find(function(p){ return p.code === productOrder[i]; });
        if(found) ordered.push(found);
      }
      for(var i=0; i<all.length; i++){
        if(!ordered.includes(all[i])) ordered.push(all[i]);
      }
      return ordered;
    }
    return all;
  }
  
  var allProducts = getAllProductsList();
  
  function saveOrder(){ var codes = allProducts.map(function(p){ return p.code; }); localStorage.setItem(STORAGE_ORDER, JSON.stringify(codes)); }
  function saveCustomProducts(){ localStorage.setItem(STORAGE_PRODUCTS, JSON.stringify(customProducts)); allProducts = getAllProductsList(); saveOrder(); renderProducts(); }
  function saveDeletedProducts(){ localStorage.setItem(STORAGE_DELETED, JSON.stringify(deletedProducts)); allProducts = getAllProductsList(); saveOrder(); renderProducts(); }
  function saveLastImport(newProducts, updatedPrices, skippedCodes){ lastImport = { date: new Date().toLocaleString(), newProducts: newProducts || [], updatedPrices: updatedPrices || [], skippedCodes: skippedCodes || [] }; localStorage.setItem(STORAGE_LAST_IMPORT, JSON.stringify(lastImport)); }
  function st(msg){ var t=document.createElement('div'); t.className='toast'; t.innerHTML=msg; document.body.appendChild(t); setTimeout(function(){t.remove()},3000); }
  function saveCart(){ localStorage.setItem(STORAGE_CART, JSON.stringify(cart)); updateCartUI(); }
  function gp(p){ return daneaPrices[p.code] || p.price; }
  
  function updateCartUI(){
    var count = cart.reduce(function(s,i){ return s+i.qty; },0);
    document.getElementById('cartCount').innerText = count;
    var itemsDiv = document.getElementById('cartItems');
    var footer = document.getElementById('cartFooter');
    if(cart.length===0){ itemsDiv.innerHTML = '<div style="text-align:center;padding:2rem;color:#94a3b8">Carrello vuoto</div>'; footer.style.display = 'none'; return; }
    var total = 0;
    itemsDiv.innerHTML = cart.map(function(item,idx){
      var p = allProducts.find(function(x){ return x.code === item.code; });
      if(!p) return '';
      var price = parseFloat(gp(p).replace(',','.'));
      var itemTotal = price * item.qty;

        if(idx >= estensioni.length){ completati++; return; }

          fetch(url).then(function(response){ return response.blob(); }).then(function(blob){

              localStorage.setItem(STORAGE_IMAGES, JSON.stringify(customImages));

              completati++;
              if(completati === prodottiSenzaImmagine.length) st('📷 Caricate ' + caricati + ' immagini');
              saveCustomProducts();
            };
            reader.readAsDataURL(blob);
          }).catch(function(){ provaEstensione(idx+1); });
        };
        img.onerror = function(){ provaEstensione(idx+1); };
        img.src = url;
      }
      provaEstensione(0);

  window.handleFullCSVFile = function(input){
    if(!input.files || !input.files[0]) return;
    var file = input.files[0];
    var reader = new FileReader();
    reader.onload = function(e){
      var text = e.target.result;
      var lines = text.split(/\r?\n/);
      if(lines.length<2){ st('File vuoto'); return; }
      var headers = lines[0].split(';');
      var colCode=-1, colName=-1, colPrice=-1;
      for(var i=0;i<headers.length;i++){
        var h = headers[i].trim().toLowerCase();
        if(h === 'cod.' || h === 'codice' || h === 'code') colCode = i;
        if(h === 'descrizione' || h === 'nome' || h === 'name') colName = i;
        if(h === 'listino 1' || h === 'prezzo' || h === 'price') colPrice = i;
      }
      if(colCode===-1){ st('❌ Colonna "Cod." non trovata'); return; }
      var nuovi = [], aggiornati = [];
      for(var i=1;i<lines.length;i++){
        var vals = lines[i].split(';');
        if(vals.length <= Math.max(colCode,colName,colPrice)) continue;
        var code = vals[colCode]?.trim();
        if(!code) continue;
        var name = (colName!==-1 && vals[colName]?.trim()) ? vals[colName].trim() : code;
        var price = (colPrice!==-1 && vals[colPrice]?.trim()) ? vals[colPrice].trim() : '0,00';
        if(price && price.indexOf(',')===-1 && price.indexOf('.')!==-1) price = price.replace('.',',');
        var existing = allProducts.find(function(p){ return p.code === code; });
        if(existing){
          var oldPrice = daneaPrices[code] || existing.price;
          daneaPrices[code] = price;
          aggiornati.push({ code: code, oldPrice: oldPrice, newPrice: price });
        } else {
          var newProduct = { code: code, name: name.substring(0, 100), price: price, img: "" };
          customProducts.push(newProduct);
          nuovi.push({ code: code, name: name.substring(0, 100), price: price });
        }
      }
      localStorage.setItem(STORAGE_DANEA, JSON.stringify(daneaPrices));
      saveCustomProducts();
      saveLastImport(nuovi, aggiornati, []);
      var history = JSON.parse(localStorage.getItem(IMPORT_HISTORY_KEY) || '[]');
      history.unshift({ id: Date.now(), filename: file.name, date: new Date().toLocaleString(), imported: nuovi.length, updated: aggiornati.length, type: 'CSV' });
      if(history.length>50) history = history.slice(0,50);
      localStorage.setItem(IMPORT_HISTORY_KEY, JSON.stringify(history));
      st('✅ CSV: '+nuovi.length+' nuovi, '+aggiornati.length+' prezzi');
      renderProducts();
      input.value = '';
    };
    reader.readAsText(file, 'UTF-8');
  };

  window.handleXMLFile = function(input){
    if(!input.files || !input.files[0]) return;
    var file = input.files[0];
    var reader = new FileReader();
    reader.onload = function(e){
      var xmlText = e.target.result;
      var lines = xmlText.split(/\r?\n/);
      var importedProducts = [], updatedPrices = [];
      for(var i=0; i<lines.length; i++){
        var line = lines[i];
        if(line.indexOf('<Cell') !== -1 && line.indexOf('</Row>') !== -1){
          var codeMatch = line.match(/<Data[^>]*>([^<]+)<\/Data>/g);
          if(codeMatch && codeMatch.length > 0){
            var firstData = codeMatch[0].replace(/<[^>]*>/g, '');
            if(firstData && firstData !== 'Cod.' && firstData !== 'Descrizione' && firstData !== 'Listino 1'){
              var code = firstData.trim();
              if(code && code.length > 0){
                var name = code;
                if(codeMatch.length > 1) name = codeMatch[1].replace(/<[^>]*>/g, '').trim() || code;
                var price = "0,00";
                for(var j=0; j<codeMatch.length; j++){
                  var dataText = codeMatch[j].replace(/<[^>]*>/g, '');
                  if(dataText && dataText.indexOf('.') !== -1 && !isNaN(parseFloat(dataText))){
                    price = dataText.replace('.',',');
                    break;
                  }
                }
                var existing = allProducts.find(function(p){ return p.code === code; });
                if(existing){
                  var oldPrice = daneaPrices[code] || existing.price;
                  daneaPrices[code] = price;
                  updatedPrices.push({ code: code, oldPrice: oldPrice, newPrice: price });
                } else {
                  customProducts.push({ code: code, name: name.substring(0, 100), price: price, img: "" });
                  importedProducts.push({ code: code, name: name.substring(0, 100), price: price });
                }
              }
            }
          }
        }
      }
      if(importedProducts.length > 0 || updatedPrices.length > 0){
        localStorage.setItem(STORAGE_DANEA, JSON.stringify(daneaPrices));
        saveCustomProducts();
        saveLastImport(importedProducts, updatedPrices, []);
        var history = JSON.parse(localStorage.getItem(IMPORT_HISTORY_KEY) || '[]');
        history.unshift({ id: Date.now(), filename: file.name, date: new Date().toLocaleString(), imported: importedProducts.length, updated: updatedPrices.length, type: 'XML' });
        if(history.length>50) history = history.slice(0,50);
        localStorage.setItem(IMPORT_HISTORY_KEY, JSON.stringify(history));
        st('✅ XML: '+importedProducts.length+' nuovi, '+updatedPrices.length+' prezzi');
        renderProducts();
      } else { st('❌ Nessun dato importato'); }
      input.value = '';
    };
    reader.readAsText(file, 'UTF-8');
  };

      html += '</div>';
    } else html += '<p style="color:#64748b">Nessun prezzo aggiornato</p>';
    html += '<div class="modal-actions"><button class="secondary" onclick="this.parentElement.parentElement.remove()">Chiudi</button></div></div>';
    modal.innerHTML = html;
    document.body.appendChild(modal);
  };
  
  window.showImportHistory = function(){
    var history = JSON.parse(localStorage.getItem(IMPORT_HISTORY_KEY) || '[]');
    var modal = document.createElement('div');
    modal.className = 'modal-overlay';
    var html = '<div class="modal"><h3>📜 Storico Import</h3>';
    if(history.length===0) html += '<p>Nessun import effettuato</p>';
    else for(var i=0;i<history.length;i++) html += '<div style="border-bottom:1px solid #eee;padding:6px 0;font-size:12px"><strong>'+history[i].filename+'</strong><br>'+history[i].date+'<br>➕ '+(history[i].imported||0)+' nuovi, 💰 '+(history[i].updated||0)+' prezzi'+(history[i].skipped ? ', ⏭️ '+history[i].skipped+' ignorati' : '')+'</div>';
    html += '<button onclick="this.parentElement.parentElement.remove()" style="margin-top:0.8rem;padding:0.4rem 0.8rem;background:#2563eb;color:white;border:none;border-radius:0.4rem;cursor:pointer">Chiudi</button></div>';
    modal.innerHTML = html;
    document.body.appendChild(modal);
  };
  
  window.toggleLogin = function(){
    if(isAdmin){ logout(); return; }
    var modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.innerHTML = '<div class="modal"><h3>🔐 Accesso Admin</h3><input type="password" id="adminPwd" placeholder="Password" style="width:100%;padding:0.4rem;margin:0.5rem 0"><div class="modal-actions"><button id="loginConfirm" class="primary">Accedi</button><button id="loginCancel" class="secondary">Annulla</button></div></div>';
    document.body.appendChild(modal);
    document.getElementById('loginConfirm').onclick = function(){
      var pwd = document.getElementById('adminPwd').value;
      if(pwd === ADMIN_PASSWORD){
        isAdmin = true; sessionStorage.setItem('cat_admin','true');
        modal.remove();
        document.getElementById('adminBar').style.display = 'flex';
        document.getElementById('loginBtn').style.display = 'none';
        st('🔓 Benvenuto Admin');
        renderProducts();
      } else st('❌ Password errata');
    };
    document.getElementById('loginCancel').onclick = function(){ modal.remove(); };
  };
  
  window.logout = function(){
    isAdmin = false;
    sessionStorage.removeItem('cat_admin');
    document.getElementById('adminBar').style.display = 'none';
    document.getElementById('loginBtn').style.display = 'inline-flex';
    st('🔒 Uscito');
    renderProducts();
  };
  
  window.exportData = function(){
    var data = { products: products, daneaPrices: daneaPrices, customProducts: customProducts, productOrder: productOrder, images: customImages };
    var blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'catalogo_backup_'+new Date().toISOString().slice(0,19)+'.json';
    a.click();
    st('💾 Backup salvato');
  };
  
  window.resetAllData = function(){
    if(!isAdmin) return;
    if(confirm('⚠️ ATTENZIONE! Cancellerà TUTTI i dati personalizzati. Sei sicuro?')){
      localStorage.clear();
      daneaPrices = {}; cart = []; customProducts = []; deletedProducts = []; productOrder = []; customImages = {};
      allProducts = getAllProductsList();
      st('🔄 Reset completato!');
      renderProducts();
      updateCartUI();
    }
  };
  
  function getFilteredProducts(){
    var term = searchTerm.toLowerCase();
    var filtered = allProducts.filter(function(p){ return !deletedProducts.includes(p.code); });
    if(!term) return filtered;
    return filtered.filter(function(p){ return p.code.toLowerCase().includes(term) || p.name.toLowerCase().includes(term); });
  }
  
  function renderProducts(){
    var filtered = getFilteredProducts();
    document.getElementById('productCount').innerText = filtered.length + ' prodotti';
    var start = (currentPage-1)*itemsPerPage;
    var pageItems = filtered.slice(start, start+itemsPerPage);
    var grid = document.getElementById('productGrid');
    if(pageItems.length===0){ grid.innerHTML='<div style="text-align:center;padding:2rem">Nessun prodotto</div>'; return; }
    grid.innerHTML = pageItems.map(function(p){
      var price = gp(p);
      var qty = productQtys[p.code] || 1;
      var isImported = p.category === "IMPORTATO CSV" || p.category === "IMPORTATO XML" || (customProducts.some(function(c){ return c.code === p.code && !products.some(function(pp){ return pp.code === p.code; }); }));
      var imgSrc = customImages[p.code] || p.img || '';
      var hasPhotoClass = (customImages[p.code] || p.img) ? 'has-photo' : '';
      
      var hoverButtons = '';
      if(isAdmin){
        hoverButtons = '<div class="img-hover-buttons">' +
          '<button class="btn-new-hover" data-tooltip="Nuovo dopo" onclick="event.stopPropagation();showAddAfterProductModal(\''+p.code+'\')"><i class="fas fa-plus"></i> Nuovo</button>' +
          '<button class="btn-move-hover" data-tooltip="Sposta" onclick="event.stopPropagation();moveToPage(\''+p.code+'\')"><i class="fas fa-arrows-alt"></i> Sposta</button>' +
          '<button class="btn-photo-hover" data-tooltip="Carica foto" onclick="event.stopPropagation();uploadPhoto(\''+p.code+'\')"><i class="fas fa-camera"></i> Foto</button>' +
          (customImages[p.code] ? '<button class="btn-delphoto-hover" data-tooltip="Elimina foto" onclick="event.stopPropagation();removePhoto(\''+p.code+'\')"><i class="fas fa-trash-alt"></i> DelFoto</button>' : '') +
          '<button class="btn-edit-hover" data-tooltip="Modifica" onclick="event.stopPropagation();showEditProductModal(\''+p.code+'\')"><i class="fas fa-edit"></i> Mod</button>' +
          '<button class="btn-del-hover" data-tooltip="Elimina" onclick="event.stopPropagation();deleteProduct(\''+p.code+'\')"><i class="fas fa-trash"></i> Del</button>' +
          '</div>';
      }
      
      return '<div class="card ' + hasPhotoClass + (daneaPrices[p.code]?' danea-card':'') + '"><div class="img-wrapper" onclick="showProductDetail(\''+p.code+'\')"><img src="'+ (imgSrc || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22 viewBox=%220 0 100 100%22%3E%3Crect fill=%22%23e2e8f0%22 width=%22100%22 height=%22100%22/%3E%3Ctext fill=%22%2394a3b8%22 x=%2250%22 y=%2255%22 text-anchor=%22middle%22 font-size=%2214%22%3E📷%3C/text%3E%3C/svg%3E') +'">'+hoverButtons+'</div><span class="product-code">'+p.code+(daneaPrices[p.code]?' <span class="badge-danea">DANEA</span>':'')+(isImported?' <span class="badge-imported">IMPORT</span>':'')+'</span><h3 onclick="showProductDetail(\''+p.code+'\')">'+p.name+'</h3><div class="price">€ '+price.replace('.',',')+' <small>+IVA</small></div><div class="product-qty-wrapper"><div class="product-qty"><button onclick="event.stopPropagation();var v=(productQtys[\''+p.code+'\']||1)-1;if(v<1)v=1;productQtys[\''+p.code+'\']=v;document.getElementById(\'qty_'+p.code+'\').value=v">−</button><input id="qty_'+p.code+'" type="number" value="'+qty+'" min="1" onclick="event.stopPropagation()" onchange="productQtys[\''+p.code+'\']=parseInt(this.value)||1"><button onclick="event.stopPropagation();var v=(productQtys[\''+p.code+'\']||1)+1;productQtys[\''+p.code+'\']=v;document.getElementById(\'qty_'+p.code+'\').value=v">+</button></div><button class="add-cart-btn" onclick="event.stopPropagation();addToCart(\''+p.code+'\')"><i class="fas fa-cart-plus"></i> Carrello</button></div></div>';
    }).join('');
    var totalPages = Math.ceil(filtered.length/itemsPerPage);
    var pagDiv = document.getElementById('pagination');
    if(totalPages<=1){ pagDiv.innerHTML=''; return; }
    var pagHtml = '';
    for(var i=1;i<=totalPages;i++) pagHtml += '<button class="page-btn'+(i===currentPage?' active':'')+'" data-page="'+i+'">'+i+'</button>';
    pagDiv.innerHTML = pagHtml;
    document.querySelectorAll('.page-btn').forEach(function(b){
      b.addEventListener('click', function(e){ currentPage = parseInt(e.target.dataset.page); renderProducts(); window.scrollTo({top:0}); });
    });
  }
  
  document.getElementById('searchInput').addEventListener('input', function(e){
    searchTerm = e.target.value;
    currentPage = 1;
    renderProducts();
  });
  
  if(isAdmin){
    document.getElementById('adminBar').style.display = 'flex';
    document.getElementById('loginBtn').style.display = 'none';
  }
  renderProducts();
})();
</script>
</body>
</html>
